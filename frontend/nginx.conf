server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  sendfile off;
  tcp_nopush off;
  tcp_nodelay on;

  # Webhook to Flask
  location = /api/instagram-comment-chat {
    proxy_pass http://api:8000/instagram-comment-chat;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Python API (setup/keywords)
  location /api/ig/ {
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Other API calls to Node backend
  location /api {
    proxy_pass http://backend:3000/api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
