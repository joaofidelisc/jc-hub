version: '3.8'

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: jcbusiness-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-jcbusiness}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jcbusiness-network

  redis:
    image: redis:7-alpine
    container_name: jcbusiness-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - jcbusiness-network

  backend:
    build: 
      context: ./backend
    container_name: jcbusiness-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
    networks:
      - jcbusiness-network

  frontend:
    build:
      context: ./frontend
    container_name: jcbusiness-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - jcbusiness-network

networks:
  jcbusiness-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
